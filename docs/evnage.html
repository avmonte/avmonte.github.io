<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Yerevan Building Age Map</title>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <link href="map.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <strong>Loading building data…</strong>
  <p>Parsing 100k+ Yerevan buildings</p>
</div>

<div id="map"></div>

<div id="legend">
  <h3>Construction year</h3>
  <div class="legend-gradient"></div>
  <div class="legend-labels"><span>≤1900</span><span>1960</span><span>2020+</span></div>

  <hr class="legend-divider">

  <label class="year-filter-label">Show buildings between years</label>
  <div class="year-filter-row">
    <input type="number" id="year-filter-from" class="year-filter-input" placeholder="from">
    <span class="year-filter-sep">–</span>
    <input type="number" id="year-filter-to" class="year-filter-input" placeholder="to">
  </div>
  <div class="year-range-slider">
    <div class="year-range-track"></div>
    <div class="year-range-fill" id="year-range-fill"></div>
    <input type="range" id="year-range-min">
    <input type="range" id="year-range-max">
  </div>

  <hr class="legend-divider">

  <label class="map-toggle"><input type="checkbox" id="theme-toggle"> Light mode</label>
</div>

<div id="stats">
  <div><span class="stat-label">Known year  </span> <span class="stat-known" id="s-known">–</span></div>
  <div><span class="stat-label">Suggested   </span> <span class="stat-suggested" id="s-suggested">–</span></div>
  <div><span class="stat-label">Inferred era </span> <span class="stat-inferred" id="s-inferred">–</span></div>
  <div><span class="stat-label">No data      </span> <span class="stat-unknown" id="s-unknown">–</span></div>
</div>

<!-- read-only viewer — same rendering as index.html, minus the suggest-a-year
     popup form and the /suggest network calls it needs. Deploy this file
     together with map.css, map.js, and buildings.geojson. -->
<script src="map.js"></script>
<script>initBuildingMap({ editable: false });</script>
</body>
</html>
