<head>

    <style>body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #111;
        color: #eee
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 2rem;
        position: fixed;
        top: 1rem;
        width: 100%;
        z-index: 1000
    }

    nav a {
        text-decoration: none;
        color: #aaa;
        font-weight: 500;
        transition: color 0.2s
    }

    nav a:hover {
        color: #fff
    }

    .container {
        max-width: 800px;
        margin: 8rem auto 0;
        padding: 0 2rem
    }

    h1, h2 {
        margin: 0 0 1rem
    }

    section {
        margin-bottom: 2rem
    }

    ul {
        padding-left: 1rem;
        list-style: none;
        margin: 0
    }

    li {
        margin-bottom: 0.5rem
    }

    .neon-stripe {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: #00f0ff;
        box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        animation: glow 2s infinite ease-in-out
    }

    @keyframes glow {
        0%, 100% {
            box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff
        }
        50% {
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff
        }
    }

    .download-link {
        color: #4fa8ff;
        text-decoration: none;
        font-weight: 500
    }

    a.download-link:hover {
        color: #fff
    }</style>
